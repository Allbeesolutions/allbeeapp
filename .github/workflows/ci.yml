name: ALLBEE CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test -- --run
      - run: npm run test:edge-auth
      - run: npm run test:rpc-surface
      - run: npx playwright install --with-deps chromium
      - run: npm run test:crash-smoke
      - run: npm run test:navigation-smoke
      - run: npm run build
      - run: npm run test:bundle
      - run: npm audit --omit=dev --audit-level=high
