name: ALLBEE CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test -- --run
      - run: npm run test:edge-auth
      - run: npm run test:rpc-surface
      - run: node scripts/check-neon-migration-portability.mjs
      - name: Verify customer analytics SQL in disposable PostgreSQL
        run: |
          if command -v pg_config >/dev/null 2>&1; then
            export PATH="$(pg_config --bindir):$PATH"
          fi
          npm run test:customer-usage-sql
          bash scripts/test-neon-foundation.sh
          bash scripts/test-neon-identity-rls.sh
      - run: npx playwright install --with-deps chromium
      - run: npm run test:crash-smoke
      - run: npm run test:navigation-smoke
      - run: npm run test:spa-soak-smoke
      - name: Check garbage-collected SPA heap retention (mock roles)
        run: npm run test:spa-memory
      - run: npm run build
      - run: npm run test:bundle
      - name: Verify isolated Neon replacement-backend pilot
        run: |
          cd neon-pilot
          npm ci --legacy-peer-deps --ignore-scripts --no-audit --no-fund
          npm test
          npm run build
          npm audit --omit=dev --audit-level=high
      - run: npm audit --omit=dev --audit-level=high
